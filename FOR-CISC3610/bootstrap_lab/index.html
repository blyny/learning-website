<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .col-box {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            padding: 10px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <div class="container mt-3">
        <h2 class="mb-3">Simple Bootstrap</h2>

        <div class="row mb-3">
            <div class="col-md">
                <div class="col-box">Hello</div>
            </div>
            <div class="col-md">
                <div class="col-box">CISC 3610!</div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-8">
                <div class="col-box">We are testing</div>
            </div>
            <div class="col-md-4">
                <div class="col-box">Grids!</div>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
