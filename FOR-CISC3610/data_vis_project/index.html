<!DOCTYPE html>
<html>
<head>
    <title>Parking Meter Locations Visualization</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .chart-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            margin-top: 30px;
        }
        .chart-box {
            width: 45%;
            min-width: 400px;
            margin-bottom: 40px;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            border-radius: 8px;
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
        }

    </style>
</head>
<body>
    <h1>Parking Meter Locations Visualization</h1>
    
    <div class="dataset">
        <h3>Parking Meter Locations</h3>
        <ul>
            <li>Manhattan: 4137</li>
            <li>Brooklyn: 3811</li>
            <li>Queens: 3641</li>
            <li>Staten Island: 284</li>
            <li>Bronx: 1463</li>
        </ul>
    </div>

    <div class="chart-container">
        <div class="chart-box">
            <canvas id="doughnutChart"></canvas>
        </div>
        <div class="chart-box">
            <canvas id="barChart"></canvas>
        </div>
    </div>

    <script>
        const boroughs = {
            labels: ['Manhattan', 'Brooklyn', 'Queens', 'Staten Island', 'Bronx'],
            values: [4137, 3811, 3641, 284, 1463],
            backgroundColors: ['#f53c3c', '#3c7cf5', '#41a833', '#be8dfc', '#fee207']
        };

        // Doughnut Chart
        const doughnutCtx = document.getElementById('doughnutChart').getContext('2d');
        new Chart(doughnutCtx, {
            type: 'doughnut',
            data: {
                labels: boroughs.labels,
                datasets: [{
                    data: boroughs.values,
                    backgroundColor: boroughs.backgroundColors,
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    title: {
                        display: true,
                        text: 'Parking Meter Locations (Bryan)',
                        font: {
                            size: 16
                        }
                    },
                    legend: {
                        position: 'right'
                    },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                const label = context.label || '';
                                const value = context.raw || 0;
                                const total = context.dataset.data.reduce((a, b) => a + b, 0);
                                const percentage = Math.round((value / total) * 100);
                                return `${label}: ${value} (${percentage}%)`;
                            }
                        }
                    }
                },
                cutout: '65%'
            }
        });

        // Horizontal Bar Chart
        const barCtx = document.getElementById('barChart').getContext('2d');
        new Chart(barCtx, {
            type: 'bar',
            data: {
                labels: boroughs.labels,
                datasets: [{
                    label: '#',
                    data: boroughs.values,
                    backgroundColor: boroughs.backgroundColors,
                    borderWidth: 1
                }]
            },
            options: {
                indexAxis: 'y',
                responsive: true,
                plugins: {
                    title: {
                        display: true,
                        text: 'Number of Parking Meters (Bryan)',
                        font: {
                            size: 16
                        }
                    },
                    legend: {
                        display: false
                    }
                },
                scales: {
                    x: {
                        beginAtZero: true,
                        title: {
                            display: true,
                            text: 'Number Of'
                        }
                    },
                    y: {
                        grid: {
                            display: false
                        }
                    }
                }
            }
        });
    </script>
</body>
</html>
